experiment:
  name: maf_teacher_stable_b_inverted_y_v2
  seed: 42

data:
  mode: maf
  split_csv: data/metadata/data_split.csv
  batch_size: 4
  val_batch_size: 16
  num_workers: 4
  augment: true

  invert_y_domain: true

model:
  x_channels: 2
  y_channels: 3
  base_channels: 64
  num_res_blocks: 9
  padding_type: reflect

loss:
  lambda_cyc: 10.0
  lambda_feat: 1.0
  lambda_sal: 1.0

  threshold: 170
  sharpness: 20.0

  auxiliary_invert_x: false

training:
  generator_lr: 0.0002
  discriminator_lr: 0.00005

  lr_scheduler: reduce_on_plateau

  plateau_factor_g: 0.5
  plateau_factor_d: 0.5
  plateau_patience: 3
  plateau_threshold: 0.5

  plateau_min_lr_g: 0.0000125
  plateau_min_lr_d: 0.00000625

  early_stopping_patience: 12
  early_stopping_min_delta: 0.0

  beta1: 0.5
  beta2: 0.999

  constant_lr_epochs: 100
  decay_epochs: 100

  fake_pool_size: 50

  compute_fid_kid: true
  fid_every: 1

  sub_eval_tile_size: 256
  sub_eval_stride: 256

  metric_batch_size: 16
  kid_subsets: 50
  kid_subset_size: 1000

checkpoint:
  save_every: 1
  keep_last: 50

logging:
  print_every: 100